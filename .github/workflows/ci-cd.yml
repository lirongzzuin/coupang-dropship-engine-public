# CI/CD: 테스트 → 이미지 빌드(GHCR) → (서버 정보가 있으면) VPS 자동 배포 + 헬스체크 + 실패 시 롤백
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter server test
      - run: pnpm --filter web build

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: 이미지 빌드(스모크 테스트용 로컬 적재)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: app:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 컨테이너 스모크 테스트(체험 모드로 기동 → /healthz)
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e PII_KEY=$(openssl rand -hex 32) -e SESSION_SECRET=$(openssl rand -hex 16) \
            -e MARKET_ADAPTER=fake -e DEMO_MODE=true -e SCHEDULER_ENABLED=false app:smoke
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && exit 0; sleep 2; done
          docker logs smoke; exit 1
      - name: GHCR 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 이미지 푸시
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/dropship' }}
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: 배포 대상 확인
        id: check
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::DEPLOY_HOST 시크릿이 없어 배포를 건너뜁니다(docs/deploy.md 참고)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: SSH 준비
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts; fi
      - name: 배포 파일 전송(compose·Caddy·스크립트)
        if: steps.check.outputs.skip != 'true'
        run: |
          scp -i ~/.ssh/id_deploy docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"
          scp -i ~/.ssh/id_deploy -r deploy "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: 배포 + 헬스체크 + 실패 시 롤백
        if: steps.check.outputs.skip != 'true'
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null && \
             APP_IMAGE='${{ env.IMAGE }}:$TAG' bash deploy/remote-deploy.sh; rc=\$?; docker logout ghcr.io >/dev/null; exit \$rc"
